<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="entradanumero" type="number">
    <button onclick="Mostrar()">Mostrar</button>
    <h1 id="resultado"></h1>

</body>
<script>
    function Mostrar() {
       const entrada =  document.getElementById('entradanumero').value
       
       for(let i = 0; i < 10; i++) {
            resultado.innerHTML += `${entrada} x ${i} = ${entrada * i}<br>`
            

       }
    }

</script>
</html>
